  <rect x="12.56" y="12.56" width="5.55" height="5.55" rx="1.56" fill="white"/>
  <rect x="21.23" y="12.56" width="5.55" height="5.55" rx="1.56" fill="white"/>
  <rect x="12.56" y="21.23" width="5.55" height="5.55" rx="1.56" fill="white"/>
  <rect x="21.23" y="29.9"  width="5.55" height="5.55" rx="1.56" fill="white"/>
  <rect x="29.9"  y="29.9"  width="5.55" height="5.55" rx="1.56" fill="white"/>
</svg>
