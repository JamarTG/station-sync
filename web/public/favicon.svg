<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Rounded black square background — rx=16 for pill-like corners -->
  <rect width="48" height="48" rx="16" fill="#111"/>
  <!-- Logo: 26×26 centred (11px padding each side), squares in white          -->
  <!-- cell=8.67  gap=1.56  rect=5.55  rx=1.56  offset=11                     -->
